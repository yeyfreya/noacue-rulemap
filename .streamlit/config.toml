# Colors matched to noacue.com (site/app/globals.css): paper, ink, line, violet.
[theme]
base = "light"
primaryColor = "#55528c"
backgroundColor = "#f0f1f4"
secondaryBackgroundColor = "#ffffff"
textColor = "#202632"
linkColor = "#55528c"
borderColor = "#cdd1da"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
